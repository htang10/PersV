name: persv

services:
  backend:
    build: apps/backend/
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - apps/backend/.env.production
    environment:
      - ENVIRONMENT=production

  celery_worker:
    build: apps/backend/
    command: celery -A src.core.celery_app worker --loglevel=info
    env_file:
      - apps/backend/.env.production
    restart: unless-stopped
