name: persv

services:
  db:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file: ./apps/backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.6-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: