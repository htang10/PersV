name: persv

x-dev-hosts: &dev-hosts
  ENVIRONMENT: "development"
  PG_HOST: "postgres"
  REDIS_HOST: "redis"

services:
  frontend:
    build: apps/frontend
    image: persv/frontend:dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /frontend/src
        - action: rebuild
          path: ./apps/frontend/package.json
    restart: unless-stopped

  backend:
    build: apps/backend
    image: persv/backend:dev
    env_file: [apps/backend/.env.development]
    ports:
      - "8000:8000"
    environment: *dev-hosts
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /backend/src
        - action: rebuild
          path: ./apps/backend/pyproject.toml
    restart: unless-stopped

  postgres:
    image: postgres:18-trixie
    env_file: [apps/backend/.env.development]
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ./apps/backend/scripts/01_schemas.sql # Run schema setup
        target: /docker-entrypoint-initdb.d/01_schemas.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d persv"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Set up demo dataset's structures
  migrate:
    build: apps/backend
    image: persv/migrate:dev
    env_file: [apps/backend/.env.development]
    environment: *dev-hosts
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Set up specific roles
  postgres-setup:
    image: postgres:18-trixie
    env_file: [apps/backend/.env.development]
    volumes:
      - ./apps/backend/scripts:/scripts:ro
    command: >
      sh -c 'PGPASSWORD="$$PG_MIGRATION_PASSWORD" psql -h postgres
      -U "$$PG_MIGRATION_USER" -d "$$PG_DATABASE" -v ON_ERROR_STOP=1
      -v demo_password="$$PG_DEMO_PASSWORD" -f /scripts/02_roles.sql'
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  redis:
    image: redis:8.10-trixie
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
