[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.3",
    "langchain>=1.3.9",
    "langchain-anthropic>=1.4.6",
    "langchain-openai>=1.3.0",
    "polars>=1.41.2",
    "psycopg2>=2.9.12",
    "redis[hiredis]>=8.0.0",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.fastapi]
entrypoint="src.main:app"

[tool.ruff.lint]
select = [
    "FAST",
    "ANN",
    "ICN",
    "LOG",
    "PT",
    "RSE",
    "RET",
    "SIM",
    "ARG",
    "I",
    "TID"
]

[tool.ruff.format]
quote-style="double"
