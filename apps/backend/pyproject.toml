[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.18.4",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.136.3",
    "langchain>=1.3.9",
    "langchain-aws>=1.7.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.20",
    "limits>=5.8.0",
    "mssql-python>=1.18.0",
    "openai>=3.49.0",
    "oracledb>=26.1.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
    "redis[hiredis]>=8.0.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.50",
    "sqlglot>=30.15.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.fastapi]
entrypoint="src.main:app"

[tool.ruff.lint]
select = [
    "FAST",
    "ANN",
    "ICN",
    "LOG",
    "PT",
    "RSE",
    "RET",
    "SIM",
    "ARG",
    "I",
    "TID"
]

ignore = [
    "ANN401",
    "SIM108",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"**/routers.py" = ["ANN201"]
"**/routers/**" = ["ANN201"]

[tool.ruff.format]
quote-style="double"
